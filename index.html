<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nhúng CSS vào trang HTML</title>
    
    <!-- Liên kết External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .internal-title {
            color: blue;
        }
        .internal-text {
            color: orange;
        }
    </style>
</head>
<body>

    <!-- Phần 1: Inline CSS (Dùng trực tiếp thuộc tính style) -->
    <h1 style="color: red;">Tiêu đề (Inline Style)</h1>
    <p style="color: purple;">Đoạn văn bản sử dụng Inline Style.</p>

    <hr>

    <!-- Phần 2: Internal CSS -->
    <h1 class="internal-title">Tiêu đề (Internal Style)</h1>
    <p class="internal-text">Đoạn văn bản sử dụng Internal Style.</p>

    <hr>

    <!-- Phần 3: External CSS -->
    <h1 class="external-title">Tiêu đề (External Style)</h1>
    <p class="external-text">Đoạn văn bản sử dụng External Style.</p>

</body>
</html>
